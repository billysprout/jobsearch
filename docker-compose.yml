# OpenClaw — hardened single-operator sandbox deployment
#
# Boundary model:
#   [Windows host] > [Docker Desktop WSL2 VM] > [gateway container] > agent tools
#
# The gateway container IS the agent sandbox:
#   - NO host bind mounts in any agent-reachable container (gateway/cli/mcp-*),
#     so no path from the agent to C:\. The only host binds are operator-side:
#     egress's read-only allowlist file and jobscrape-config's operator-state
#     dirs (configs rw for the shared scrape config, state/logs read-only) —
#     none reachable from the sandbox network side
#   - NO Docker socket mounted, per-agent docker sandbox stays OFF
#   - egress ONLY through the squid allowlist proxy (api.z.ai / open.bigmodel.cn);
#     the gateway sits on an internal network with no direct route to the internet
#   - read-only rootfs, cap_drop ALL, no-new-privileges, non-root (node, uid 1000)
#   - gateway binds loopback; host port published to 127.0.0.1 only (never LAN)
#
# See SECURITY-REVIEW.md for the escape-path analysis behind every choice here.

name: openclaw-sandbox

services:
  # ---------------------------------------------------------------- egress ---
  # Squid allowlist proxy — the ONLY container with a route to the internet.
  # Every denied connection is logged: `docker compose logs egress`
  # is the exfiltration-attempt detector for this deployment.
  egress:
    build: ./egress
    image: openclaw-egress:local
    networks: [internal, egress]
    # operator-side config only — this container never runs agent code
    volumes:
      - ./egress/extra-domains.txt:/etc/squid/extra/extra-domains.txt:ro
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # ------------------------------------------------------------- gateway -----
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    env_file:
      - path: .env
        required: true
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      # no mDNS broadcast of gateway presence
      OPENCLAW_DISABLE_BONJOUR: "1"
      # z.ai provider (key lives in .env; never committed)
      ZAI_API_KEY: ${ZAI_API_KEY}
      # Force outbound HTTP(S) through the allowlist proxy. Node 24 honors
      # NODE_USE_ENV_PROXY for fetch/undici. NOTE: the proxy env vars are
      # convenience only — the real control is that the internal network has
      # no direct route out, so a process that ignores these vars simply
      # fails to reach anything (fail-closed).
      NODE_USE_ENV_PROXY: "1"
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,mcp-colibri,mcp-salary,mcp-jobscrape
      TZ: ${OPENCLAW_TZ:-UTC}
    # host.docker.internal resolves to the Windows host so the agent can reach a
    # locally-running colibri model server (plain HTTP, port 8000). Traffic still
    # flows through the squid proxy (forced by NODE_USE_ENV_PROXY + proxy env
    # vars) — the gateway never gets a direct route out of its sealed network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [internal]
    # NOTHING from the host filesystem is mounted into this container.
    volumes:
      - openclaw-config:/home/node/.openclaw
      - openclaw-workspace:/home/node/.openclaw/workspace
      - openclaw-auth:/home/node/.config/openclaw
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /home/node/.npm:size=128m,noexec,nosuid
    init: true
    restart: unless-stopped
    # "lan" bind (all interfaces) is intentional here: the gateway sits on the
    # sealed internal network whose only neighbors are the egress proxy and the
    # loopback forwarder, and it has no published port of its own. Host access
    # is ONLY via frontend -> 127.0.0.1:18789, token-authenticated. A loopback
    # bind would be unreachable from the forwarder (different netns).
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    # Mirrors the image's built-in HEALTHCHECK (inline fetch of the gateway's
    # own /healthz). A previous override ran `node dist/docker-healthcheck.js`,
    # a file that does not exist in the pinned image — Docker reported the
    # gateway "unhealthy" for days while the gateway itself was fine.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 256
    depends_on: [egress]

  # ---------------------------------------------------------------- cli ------
  # Operator one-shot CLI. Shares the gateway's network namespace (loopback WS).
  # Started only on demand:  docker compose run --rm cli <args...>
  cli:
    profiles: [cli]
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    network_mode: "service:openclaw-gateway"
    env_file:
      - path: .env
        required: true
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      ZAI_API_KEY: ${ZAI_API_KEY}
      NODE_USE_ENV_PROXY: "1"
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      NO_PROXY: localhost,127.0.0.1
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - openclaw-config:/home/node/.openclaw
      - openclaw-workspace:/home/node/.openclaw/workspace
      - openclaw-auth:/home/node/.config/openclaw
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /home/node/.npm:size=128m,noexec,nosuid
    init: true
    stdin_open: true
    tty: true
    entrypoint: ["node", "dist/index.js"]
    depends_on: [openclaw-gateway]

  # ---------------------------------------------------------- mcp-colibri ----
  # MCP tool server — exposes ask_colibri as a tool the agent can invoke.
  # Proxies requests to the local colibri model on the Windows host through
  # the squid egress proxy (same forced-proxy pattern as the gateway).
  #
  # The agent (running on z.ai) calls this tool on-demand; colibri's response
  # comes back through the MCP SSE stream. Latency is 30-120s per call.
  mcp-colibri:
    build: ./mcp-colibri
    image: mcp-colibri:local
    networks: [internal]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      COLIBRI_BASE_URL: http://host.docker.internal:8000/v1
      COLIBRI_MODEL: glm-5.2-colibri
      # 45 min: colibri's own docs warn >500-token prompts can take 10+ min
      # and "may exceed 15-min timeout" — the original 900000 (15 min) value
      # was hit for real on a 922-token prompt. Kept under squid's 60-minute
      # client_lifetime hard cap (egress/squid.conf) with margin.
      COLIBRI_TIMEOUT_MS: "2700000"
      LOG_LEVEL: "info"
      # Force colibri requests through the squid allowlist proxy.
      # squid's host_local ACL permits plain HTTP to host.docker.internal.
      # Node 22 requires NODE_USE_ENV_PROXY=1 to honor HTTP_PROXY.
      NODE_USE_ENV_PROXY: "1"
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      NO_PROXY: localhost,127.0.0.1
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 32
    depends_on: [egress]
    # Loopback-only publish of /health (GET, read-only job-count status, no
    # auth) so the host-side jobscrape pipeline can check jobs_running before
    # firing its own colibri calls — colibri serializes requests, so this and
    # an in-conversation ask_colibri call landing at once would otherwise
    # silently queue behind each other. Same trust tier as the frontend's
    # existing 127.0.0.1-only gateway publish: reachable only from this
    # Windows host, never LAN. Does not expose ask_colibri/check_colibri
    # (those stay MCP-SSE-only on the internal network) — only /health.
    ports:
      - "127.0.0.1:${MCP_COLIBRI_HEALTH_PORT:-8090}:3000"

  # ---------------------------------------------------------- mcp-salary ----
  # MCP tool server for salary research: salary_bls (official BLS OEWS wages)
  # and salary_levels_fyi (deep links — levels.fyi has no public API; see the
  # tool description for why it returns links, not numbers).
  #
  # Synchronous tools (plain HTTPS fetches, seconds — no fire-and-poll needed
  # unlike colibri). Egress only to api.bls.gov through the squid allowlist
  # proxy. No host access (no extra_hosts), no published ports (agent-only).
  mcp-salary:
    build: ./mcp-salary
    image: mcp-salary:local
    networks: [internal]
    environment:
      BLS_API_URL: https://api.bls.gov/publicAPI/v1/timeseries/data/
      LOG_LEVEL: "info"
      # Force BLS requests through the squid allowlist proxy (same forced-proxy
      # pattern as mcp-colibri; fail-closed if the env vars are ignored).
      NODE_USE_ENV_PROXY: "1"
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      NO_PROXY: localhost,127.0.0.1
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 32
    depends_on: [egress]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ------------------------------------------------------ mcp-jobscrape -----
  # Agent-driven configuration for the job scraper: the agent maps a
  # non-technical user's chat requests ("block Acme", "only recent postings")
  # onto typed tools that proxy to the jobscrape-config container
  # (jobscrape-config:8790, token-gated — see jobscrape/config-server.mjs).
  # Dual-homed: internal (agent SSE) + jobscrape (config peer). The gateway
  # has NO route to jobscrape-config — the only path to config writes is this
  # container's curated tool table. The token is config-write power — it
  # lives in .env, never committed.
  mcp-jobscrape:
    build: ./mcp-jobscrape
    image: mcp-jobscrape:local
    networks: [internal, jobscrape]
    environment:
      JOBSCRAPE_CONFIG_URL: http://jobscrape-config:8790
      JOBSCRAPE_CONFIG_TOKEN: ${JOBSCRAPE_CONFIG_TOKEN}
      LOG_LEVEL: "info"
      NODE_USE_ENV_PROXY: "1"
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,jobscrape-config
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 32
    depends_on: [egress, jobscrape-config]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --------------------------------------------------- jobscrape-config -----
  # Config/status service for the host-run scrape (formerly a host Node
  # process on 0.0.0.0:8790 — containerized so it survives sessions and no
  # host listener exists). Isolated on the jobscrape network: its ONLY peers
  # are mcp-jobscrape (the curated tool path) and the jobscrape-frontend
  # forwarder (browser status page). Makes no outbound calls — no proxy env,
  # no egress dependency. Shares configs/state/logs with the host via binds
  # because the 07:00 HOST task (scrape.mjs, needs host docker CLI + tar)
  # reads/writes the same files; the rw configs bind is the stack's only
  # writable host mount (operator state, same trust tier as egress's
  # extra-domains.txt).
  jobscrape-config:
    build: ./jobscrape
    image: jobscrape-config:local
    networks: [jobscrape]
    environment:
      JOBSCRAPE_CONFIG_TOKEN: ${JOBSCRAPE_CONFIG_TOKEN}
    volumes:
      - ./jobscrape/configs:/app/configs
      - ./jobscrape/state:/app/state:ro
      - ./jobscrape/logs:/app/logs:ro
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 32
    healthcheck:
      # 127.0.0.1, not localhost: the server binds 0.0.0.0 (IPv4 only) and
      # localhost resolves to ::1 first inside the container → refused
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8790/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ------------------------------------------------- jobscrape-frontend -----
  # Loopback port publisher for jobscrape-config's status page (same socat
  # forwarder pattern + frontend image as above: published ports don't
  # function on internal networks). Host 127.0.0.1:${JOBSCRAPE_CONFIG_PORT:-8790}
  # -> jobscrape-config:8790. The browser status URL is unchanged.
  jobscrape-frontend:
    build: ./frontend
    image: openclaw-frontend:local
    networks: [jobscrape, egress]
    entrypoint: ["socat", "TCP-LISTEN:8790,fork,reuseaddr", "TCP:jobscrape-config:8790"]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 64
    ports:
      - "127.0.0.1:${JOBSCRAPE_CONFIG_PORT:-8790}:8790"
    depends_on: [jobscrape-config]

  # ---------------------------------------------------------- frontend ------
  # Loopback port publisher for the gateway (published ports don't function on
  # internal networks — this forwarder is the documented R6 fallback in
  # SECURITY-REVIEW.md). Inbound-only relay: host 127.0.0.1 -> gateway:18789.
  #
  # A Meta WhatsApp Cloud API migration briefly planned routing a webhook
  # through this publish via Tailscale Funnel; abandoned 2026-08-24 before
  # going live (see SECURITY-REVIEW.md §4 R15) — no inbound wiring needed
  # here. The Telegram channel added the same day (§4 R16-R18) uses long
  # polling (outbound-only), so it doesn't touch this service either.
  frontend:
    build: ./frontend
    image: openclaw-frontend:local
    networks: [internal, egress]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    ports:
      # loopback-only publish: reachable from THIS Windows host only, never LAN
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    depends_on: [openclaw-gateway]

networks:
  # No default route to the internet for anything on this network.
  internal:
    internal: true
  # Only the egress proxy + loopback forwarder are attached here.
  egress: {}
  # jobscrape-config + mcp-jobscrape + its loopback forwarder ONLY. The
  # gateway is deliberately NOT attached: no route, no DNS — the gateway's
  # only path to jobscrape config is mcp-jobscrape's curated tools.
  jobscrape:
    internal: true

volumes:
  openclaw-config: {}
  openclaw-workspace: {}
  openclaw-auth: {}
