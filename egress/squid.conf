# Deny-by-default egress allowlist for the OpenClaw sandbox.
#
# Permitted: HTTPS CONNECT to the z.ai API hosts ONLY (the model provider
# this instance needs to function). Everything else is refused and logged.
# Inspect refusals (exfiltration attempts) with:  docker compose logs egress
#
# TLS is never intercepted — squid sees destinations, not payloads.

http_port 3128

acl SSL_ports port 443
acl CONNECT method CONNECT
acl allowed_domains dstdomain .z.ai .bigmodel.cn
# Operator-widening hook: extra domains live in extra-domains.txt (bind-mounted
# read-only from this folder). It ships EMPTY. `bash setup.sh egress-setup`
# temporarily adds the npm registry for scripted operator steps (plugin install,
# upgrade); `bash setup.sh egress-lockdown` empties it again. The file IS the
# auditable state of the widened allowlist — check it any time.
acl extra_domains dstdomain "/etc/squid/extra/extra-domains.txt"

# Local model servers: colibri (8000) and the Ollama fallback (11434) serve
# plain HTTP on the host. Allow plain HTTP to host.docker.internal on those
# MODEL PORTS ONLY — never an arbitrary host port: Docker Desktop routes
# host.docker.internal to the host loopback, where this stack publishes its
# own loopback-only services (e.g. the jobscrape status page on 8790), and
# proxy-honoring containers must not reach those sideways. Everything else:
# TLS-only posture.
acl host_local dstdomain host.docker.internal
acl host_model_ports port 8000 11434
http_access allow host_local host_model_ports
http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_domains
http_access allow CONNECT extra_domains
# (unreachable: line above denies CONNECT to non-443 first — kept only to
# document that TLS to the host was never intended)
# http_access allow CONNECT host_local
http_access deny all

# no caching, no on-disk state
cache deny all
cache_mem 0
coredump_dir /tmp

# foreground logging to stdout/stderr (visible via docker logs)
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pid_filename /tmp/squid.pid

# Tunnel lifetimes. The read_timeout must accommodate slow local model
# inference (colibri on a 359 GB model can take >5 min per request).
# connect_timeout: how long to wait for the initial TCP handshake.
# read_timeout: idle time between data chunks before squid kills the tunnel.
#   Colibri's own streaming keepalive (~10s pings during generation) keeps
#   this well-fed during active use; it mainly guards against a truly dead
#   connection.
# client_lifetime: max total connection duration (hard cap, NOT reset by
#   activity — unlike read_timeout, colibri's keepalive pings don't help
#   here). Raised from 60 min to 6h: colibri's own docs put a >500-token
#   prompt at "10+ minutes", and a full coding-agent-scale prompt (~4K
#   tokens) extrapolates to multiple hours given colibri's documented
#   superlinear scaling. 60 min was hit for real (job dd564911, a 922-token
#   prompt) well before generation finished. Low-risk to raise: every
#   destination this proxy allows is already tightly allowlisted (z.ai,
#   WhatsApp, raw.githubusercontent.com, host.docker.internal model ports
#   8000/11434) — this only
#   lets an already-trusted tunnel run longer, it doesn't open anything new.
# request_timeout: how long to wait for the HTTP request/response headers.
connect_timeout 30 seconds
read_timeout 30 minutes
client_lifetime 6 hours
request_timeout 30 seconds
